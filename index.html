<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="styles.css" />
</head>


<body>
<audio id="click" src="click.wav" preload="auto"></audio>

<div class="keyboard">

  <div class="esc-f13">
    <p>esc</p>
    <p>f1</p>
    <p>f2</p>
    <p>f3</p>
    <p>f4</p>
    <p>f5</p>
    <p>f6</p>
    <p>f7</p>
    <p>f8</p>
    <p>f9</p>
    <p>f10</p>
    <p>f11</p>
    <p>f12</p>
    <p>f13</p>
  </div>

  <div class="mid">
    <p>§</p>
    <p>1</p>
    <p>2</p>
    <p>3</p>
    <p>4</p>
    <p>5</p>
    <p>6</p>
    <p>7</p>
    <p>8</p>
    <p>9</p>
    <p>0</p>
    <p>-</p>
    <p>+</p>
    <p class="letter-fit">backspace</p>
  </div>

  <div class="mid-container">

    <div class="mid-c1">
      <div class="mid">
        <p class="letter-fit large1">tab</p>
        <p>q</p>
        <p>w</p>
        <p>e</p>
        <p>r</p>
        <p>t</p>
        <p>y</p>
        <p>u</p>
        <p>i</p>
        <p>o</p>
        <p>p</p>
        <p>[</p>
        <p>]</p>
      </div>

      <div class="mid">
        <p class="letter-fit large1">caps lock</p>
        <p>a</p>
        <p>s</p>
        <p>d</p>
        <p>f</p>
        <p>g</p>
        <p>h</p>
        <p>j</p>
        <p>k</p>
        <p>l</p>
        <p>;</p>
        <p>'</p>
        <p>\</p>
      </div>
    </div>

    <div class="mid-c2">

      <p class="letter-fit enter high">enter</p>
      <p class="letter-fit enter low"> </p>
   </div>

  </div>

  <div class="mid">
    <p class="letter-fit large1">shift</p>
    <p>`</p>
    <p>z</p>
    <p>x</p>
    <p>c</p>
    <p>v</p>
    <p>b</p>
    <p>n</p>
    <p>m</p>
    <p>,</p>
    <p>.</p>
    <p>/</p>
    <p class="letter-fit large2">shift</p>
  </div>

  <div class="ctrl-ctrl">
  <p class="letter-fit large1">ctrl</p>
  <p class="letter-fit large1">win</p>
  <p class="letter-fit large1">alt</p>
  <p class="space"></p>
  <p class="letter-fit large1">alt</p>
  <p class="letter-fit large1">win</p>
  <p class="letter-fit large1">ctrl</p>
  </div>

</div>


<script>
  const sound = document.getElementById('click');
  document.querySelectorAll('.esc-f13 p, .mid p, .ctrl-ctrl p, .mid-c2').forEach(key => {
    key.addEventListener('mousedown', () => {
      sound.currentTime = 0;
      sound.play();
    });
  });
</script>

</body>
</html>
